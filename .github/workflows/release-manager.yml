# Release for the pool-status-manager crate in manager/.  Runs only on
# "manager-v*" tags; the root crate's workflow (release.yml) runs on "v*"
# tags and is unchanged.  Builds in GitHub Actions with
# source_repo=github:BLNT-Protocol/pool-status-admin and home_domain=blnt.trade
# in the wasm's contractmetav0, publishes a release with the wasm, a GitHub
# build attestation over it, and registers the build with stellar.expert.
name: Build and Release (manager)

on:
  push:
    tags:
      - 'manager-v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@88068ec50cba931a96436869727ed08edeb76ade # main on 2026-07-23, stellar-cli 27.0.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Pool Status Manager'
      relative_path: manager
      package: 'pool-status-manager'
      home_domain: blnt.trade
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
